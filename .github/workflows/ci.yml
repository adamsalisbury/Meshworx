name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # The scale-out backplane's Redis package (AdamSalisbury.Meshworx.Backplane.Redis) tests against a
      # real Redis server rather than a mock, so one is available for the whole job on the default port —
      # exactly the "install what a test suite actually needs, don't assume it" discipline libmsquic
      # below already established for the QUIC transport.
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install libmsquic
        # The QUIC transport's tests need the native msquic library, which is not guaranteed to be
        # preinstalled on the runner image. Installed explicitly from Microsoft's own package feed
        # rather than assumed, so a QuicListener.IsSupported/QuicConnection.IsSupported check never
        # silently reports false here and skips that test suite without anyone noticing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Restore
        run: dotnet restore Meshworx.slnx

      - name: Build
        run: dotnet build Meshworx.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Meshworx.slnx --configuration Release --no-build --verbosity normal
