name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Meshworx.slnx

      - name: Build
        run: dotnet build Meshworx.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Meshworx.slnx --configuration Release --no-build --verbosity normal
